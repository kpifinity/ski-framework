version: '3.8'

# ============================================================================
# SKI Framework Reference Implementation — Sovereign by Default
# ============================================================================
# This stack runs entirely on-premise. No cloud API calls during runtime.
# Inference is performed by a local SKI Model (Ollama backend) operating
# inside the sovereign boundary.
#
# STATUS: EARLY ALPHA — not production ready. See README.md.
# ============================================================================

services:

  # --------------------------------------------------------------------------
  # Local LLM runtime (Ollama) — provides the SKI Model inference backend.
  # Runs entirely offline once the model has been pulled at provisioning time.
  # --------------------------------------------------------------------------
  ollama:
    # >= 0.5.0 is required: the runtime sends a JSON-schema object as
    # /api/generate `format`; 0.3.x/0.4.x accept only a string there and
    # reject every request (400), which v3.1.x mapped to DISCRETIONARY.
    # Pinned by multi-arch index digest (linux/amd64 + linux/arm64); keep in
    # step with deploy/helm/ski/values.yaml (ollama.image).
    image: ollama/ollama:0.40.5@sha256:5d3a2f25f9825628daba94dc0b1d421c7d57d6c03ae5faa9ba050e058bab8241
    container_name: ski-ollama
    # No host port published by default — the SKI Model is the only client.
    # Uncomment for local debugging on host 11434.
    # ports:
    #   - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - ski-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # --------------------------------------------------------------------------
  # SKI Model service — the v3 runtime. Scopes the signed KG to the
  # measurement's jurisdiction + effective date, evaluates via the local
  # LLM (temperature=0, structured generation), and independently
  # cross-checks every formalizable assertion with the Symbolic Verifier.
  # --------------------------------------------------------------------------
  ski-model:
    build:
      context: ..
      dockerfile: reference-implementation/Dockerfile.ski-model
    container_name: ski-model
    ports:
      - "8000:8000"
    environment:
      # Inference backend — local Ollama by default. SKI_V3_LLM_BACKEND is the
      # name the runtime reads (v3.1.x compose set SKI_INFERENCE_BACKEND, which
      # the runtime ignored, so it silently ran FakeLLM). There is no cloud backend.
      SKI_V3_LLM_BACKEND: ${SKI_V3_LLM_BACKEND:-ollama}
      # Deprecated alias, passed through on purpose: a stale .env that still
      # sets it to a DIFFERENT backend makes the runtime refuse to start
      # instead of being silently ignored.
      SKI_INFERENCE_BACKEND: ${SKI_INFERENCE_BACKEND:-}
      SKI_MODEL_NAME: ${SKI_MODEL_NAME:-qwen2.5:7b-instruct}
      SKI_MODEL_TEMPERATURE: "0"
      SKI_MODEL_SEED: "${SKI_MODEL_SEED:-42}"
      SKI_MODEL_MAX_TOKENS: ${SKI_MODEL_MAX_TOKENS:-512}
      SKI_MODEL_FILE_SHA256: ${SKI_MODEL_FILE_SHA256:-}
      OLLAMA_BASE_URL: http://ollama:11434
      # Spec §6: strict refuses to start unless every sovereignty check
      # passes, including a pinned SKI_MODEL_FILE_SHA256.
      SKI_SOVEREIGNTY: ${SKI_SOVEREIGNTY:-strict}
      SKI_SOVEREIGN_LOCAL_DOMAINS: ${SKI_SOVEREIGN_LOCAL_DOMAINS:-}
      KG_PATH: /app/kg/kg.json
      KG_REQUIRE_SIGNATURE: ${KG_REQUIRE_SIGNATURE:-true}
      # v3.2.0: least-privilege ledger role (INSERT + SELECT only), never the
      # owner/superuser. The role and its password are created on first init
      # (02-append-only.sql + 04-ledger-writer-login.sh below).
      LEDGER_DSN: postgresql://ski_ledger_writer:${SKI_LEDGER_WRITER_PASSWORD:?SKI_LEDGER_WRITER_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ski_ledger}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TLS_ENABLED: ${TLS_ENABLED:-true}
      API_KEY: ${SKI_API_KEY:?SKI_API_KEY is required — generate one with `openssl rand -hex 32`}
      DETERMINISM_CANARY_INTERVAL: ${DETERMINISM_CANARY_INTERVAL:-300}
      # Framework v3.2.0 KG trust anchors: the KG must verify against one of
      # the operator-pinned Ed25519 public keys in this PEM bundle (mounted
      # below from SKI_KG_TRUST_ANCHORS_HOST_FILE). Never the KG's own key.
      # An explicitly EMPTY value in .env means "no anchors": the runtime then
      # refuses every signed KG unless the dev-only escape hatch below is set.
      SKI_KG_TRUST_ANCHORS: ${SKI_KG_TRUST_ANCHORS-/app/trust/kg-trust-anchors.pem}
      SKI_KG_ALLOW_UNANCHORED: ${SKI_KG_ALLOW_UNANCHORED:-false}
      # POST /api/kg/load is disabled unless explicitly enabled; it then
      # requires SKI_ADMIN_API_KEY (never SKI_API_KEY, which the sidecar holds).
      SKI_ENABLE_KG_HOT_LOAD: ${SKI_ENABLE_KG_HOT_LOAD:-false}
      SKI_ADMIN_API_KEY: ${SKI_ADMIN_API_KEY:-}
      # Transcript signing key lives on the persistent ski-model-data volume.
      # First-boot generation is an explicit opt-in (.env from setup.sh sets
      # it); a missing key while the ledger holds signed transcripts always
      # refuses to start.
      SKI_TRANSCRIPT_KEY_PATH: /data/keys/transcript.ed25519
      SKI_ALLOW_KEY_GENERATION: ${SKI_ALLOW_KEY_GENERATION:-false}
    volumes:
      - ./examples/knowledge-graphs:/app/kg:ro
      - ${SKI_KG_TRUST_ANCHORS_HOST_FILE:-./kg-signing/kg-trust-anchors.pem}:/app/trust/kg-trust-anchors.pem:ro
      - ski-model-data:/data
      - ./tls:/app/tls:ro
    networks:
      - ski-internal
    depends_on:
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--cacert", "/app/tls/ca.crt", "https://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # --------------------------------------------------------------------------
  # Sidecar — passive, read-only telemetry intake. Forwards normalized
  # records to the SKI Model. Does not perform tag inference.
  # --------------------------------------------------------------------------
  sidecar:
    build:
      context: .
      dockerfile: Dockerfile.sidecar
    container_name: ski-sidecar
    environment:
      SKI_MODEL_ENDPOINT: https://ski-model:8000
      SKI_MODEL_API_KEY: ${SKI_API_KEY:?SKI_API_KEY is required}
      SKI_MODEL_CA_CERT: /app/tls/ca.crt
      TELEMETRY_SOURCE: ${TELEMETRY_SOURCE:-file}
      TELEMETRY_BATCH_SIZE: ${TELEMETRY_BATCH_SIZE:-100}
      HEARTBEAT_INTERVAL: ${HEARTBEAT_INTERVAL:-60}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-operational-data}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./examples/telemetry:/data:ro
      - ./tls:/app/tls:ro
    networks:
      - ski-internal
    depends_on:
      - ski-model
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # --------------------------------------------------------------------------
  # PostgreSQL — audit ledger storage. Append-only enforced at the database
  # layer via triggers (see src/ledger/schema.sql).
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:15.6-alpine
    container_name: ski-ledger-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ski_ledger}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — see SECURITY_DEFAULTS.md}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      # Read only by 04-ledger-writer-login.sh on first init.
      SKI_LEDGER_WRITER_PASSWORD: ${SKI_LEDGER_WRITER_PASSWORD:?SKI_LEDGER_WRITER_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/ledger/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/ledger/append_only.sql:/docker-entrypoint-initdb.d/02-append-only.sql:ro
      # PR 15: also run the v3 transcript-columns migration on first init.
      # On fresh deployments the v3 baseline in schema.sql already provides
      # the columns and constraints; this migration is idempotent (every
      # ALTER is guarded with IF [NOT] EXISTS) so it is a no-op against a
      # clean v3 schema. It remains in tree for operators upgrading an
      # existing v0.2 ledger that has only the v2.1 baseline.
      - ./src/ledger/migrations/0002_transcript_columns.sql:/docker-entrypoint-initdb.d/03-transcript-columns.sql:ro
      - ./src/ledger/ledger_writer_login.sh:/docker-entrypoint-initdb.d/04-ledger-writer-login.sh:ro
      # Telemetry buffer (stateful predicates, freshness gate, replay).
      - ./src/ledger/telemetry_buffer.sql:/docker-entrypoint-initdb.d/05-telemetry-buffer.sql:ro
    networks:
      - ski-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # PostgreSQL Prometheus exporter — Postgres does not expose /metrics
  # natively. This sidecar publishes the metrics Prometheus scrapes.
  # --------------------------------------------------------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: ski-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ski_ledger}?sslmode=disable"
    networks:
      - ski-internal
    depends_on:
      - postgres
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Kafka (optional) — used when TELEMETRY_SOURCE=kafka. Authentication is
  # ENABLED by default; PLAINTEXT is disabled. See SECURITY_DEFAULTS.md.
  # --------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ski-kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: SASL_PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SASL_PLAINTEXT:SASL_PLAINTEXT
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-256
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: SCRAM-SHA-256
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/jaas.conf"
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./monitoring/kafka_jaas.conf:/etc/kafka/jaas.conf:ro
    networks:
      - ski-internal
    depends_on:
      - zookeeper
    restart: unless-stopped
    profiles: ["kafka"]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ski-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_INIT_LIMIT: 5
    volumes:
      - zookeeper-data:/var/lib/zookeeper
    networks:
      - ski-internal
    restart: unless-stopped
    profiles: ["kafka"]

  # --------------------------------------------------------------------------
  # Prometheus — operational metrics. Alert rules live in monitoring/rules/.
  # --------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: ski-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - ski-internal
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Grafana — dashboards. Admin password is mandatory; no default 'admin'.
  # --------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.1
    container_name: ski-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:?GRAFANA_USER is required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required — see SECURITY_DEFAULTS.md}
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_PROTOCOL: ${GRAFANA_PROTOCOL:-https}
      GF_SERVER_CERT_FILE: /etc/grafana/certs/grafana.crt
      GF_SERVER_CERT_KEY: /etc/grafana/certs/grafana.key
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./tls/grafana:/etc/grafana/certs:ro
    networks:
      - ski-internal
    depends_on:
      - prometheus
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # pgAdmin — disabled by default. Enable via `--profile pgadmin`.
  # --------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:8.5
    container_name: ski-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-}
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - ski-internal
    depends_on:
      - postgres
    restart: unless-stopped
    profiles: ["pgadmin"]

volumes:
  ollama-models:
  ski-model-data:
  postgres-data:
  prometheus-data:
  grafana-data:
  pgadmin-data:
  kafka-data:
  zookeeper-data:

networks:
  # `ski-internal` has no external connectivity by design. The sovereign
  # boundary is enforced by docker network isolation plus host firewall rules
  # documented in SECURITY_DEFAULTS.md.
  ski-internal:
    driver: bridge
    internal: false  # set to true in air-gapped deployments
