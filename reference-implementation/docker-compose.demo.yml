# ============================================================================
# SKI Framework — 5-MINUTE DEMO stack. NOT conformant. NOT for production.
# ============================================================================
# Runs the full v3 pipeline — evaluator, Symbolic Verifier, signed
# transcripts, append-only ledger, /metrics — with the deterministic
# FakeLLM backend instead of a local model, so there is no multi-GB
# model download between you and your first verdict.
#
#   cd reference-implementation
#   ../scripts/setup.sh                # secrets + self-signed TLS (once)
#   docker compose -f docker-compose.demo.yml up -d
#   curl -k https://localhost:8000/api/health
#
# Why "not conformant": SKI_V3_LLM_BACKEND=fake is a pattern-matching
# stub. It exercises every framework guarantee (provenance, signing,
# verification, ledger) but performs no real language-model evaluation.
# Use the main docker-compose.yml (Ollama) or a vLLM deployment for
# anything beyond a demo.
# ============================================================================

services:

  ski-model:
    build:
      context: ..
      dockerfile: reference-implementation/Dockerfile.ski-model
    container_name: ski-model-demo
    ports:
      - "8000:8000"
    environment:
      SKI_V3_LLM_BACKEND: fake
      # v3.2.0: the runtime refuses to start on FakeLLM without this
      # explicit opt-in (so a production stack that forgets to pick a
      # backend cannot silently serve pattern-matched verdicts).
      SKI_ALLOW_FAKE_LLM: "true"
      # FakeLLM is not a sovereign backend (spec §6.2), so the demo runs in
      # advisory mode: unmet requirements are logged, not fatal. Never in
      # production.
      SKI_SOVEREIGNTY: advisory
      KG_PATH: /app/kg/kg.json
      # Even the demo boots conformantly: setup.sh generates and SIGNS
      # the demo KG locally (scripts/make-demo-kg.py).
      KG_REQUIRE_SIGNATURE: "true"
      # Least-privilege ledger role (INSERT + SELECT only), as in production.
      LEDGER_DSN: postgresql://ski_ledger_writer:${SKI_LEDGER_WRITER_PASSWORD:?run ../scripts/setup.sh first}@postgres:5432/${POSTGRES_DB:-ski_ledger}
      API_KEY: ${SKI_API_KEY:?run ../scripts/setup.sh first}
      TLS_ENABLED: ${TLS_ENABLED:-true}
      LOG_LEVEL: INFO
      # Framework v3.2.0: a KG loads only if its signature verifies against
      # an operator-pinned trust anchor, never the key embedded in the KG.
      # setup.sh (scripts/make-demo-kg.py) writes the demo public key as a
      # one-key anchor bundle; it is mounted read-only below and pinned here.
      SKI_KG_TRUST_ANCHORS: /app/trust/kg-trust-anchors.pem
      # Transcript signing key on a named volume so it survives container
      # re-creation. Generating it on first boot is an explicit opt-in;
      # a missing key while the ledger holds signed transcripts always
      # refuses to start.
      SKI_TRANSCRIPT_KEY_PATH: /data/keys/transcript.ed25519
      SKI_ALLOW_KEY_GENERATION: "true"
    volumes:
      - ./examples/knowledge-graphs/kg.json:/app/kg/kg.json:ro
      - ./kg-signing/kg-trust-anchors.pem:/app/trust/kg-trust-anchors.pem:ro
      - ./tls:/app/tls:ro
      - ski-demo-data:/data
    networks: [ski-demo]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15.6-alpine
    container_name: ski-ledger-db-demo
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ski_ledger}
      POSTGRES_USER: ${POSTGRES_USER:?run ../scripts/setup.sh first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ../scripts/setup.sh first}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      SKI_LEDGER_WRITER_PASSWORD: ${SKI_LEDGER_WRITER_PASSWORD:?run ../scripts/setup.sh first}
    volumes:
      - ./src/ledger/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/ledger/append_only.sql:/docker-entrypoint-initdb.d/02-append-only.sql:ro
      - ./src/ledger/migrations/0002_transcript_columns.sql:/docker-entrypoint-initdb.d/03-transcript-columns.sql:ro
      - ./src/ledger/ledger_writer_login.sh:/docker-entrypoint-initdb.d/04-ledger-writer-login.sh:ro
    networks: [ski-demo]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ski-demo-data:

networks:
  ski-demo:
    driver: bridge
