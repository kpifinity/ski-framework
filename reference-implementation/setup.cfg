# Mutation testing (mutmut) of the safety-critical decision code: the Symbolic
# Verifier and the risk-tier policy. Run by the scheduled "quality" workflow;
# locally: `mutmut run && mutmut results`. String-only mutations of log and
# note text are expected survivors; scripts/mutation_score.py counts the rest.
[mutmut]
paths_to_mutate =
    src/ski_model/v3/verifier.py
    src/ski_model/v3/policies/risk_tier.py
pytest_add_cli_args_test_selection =
    src/ski_model/v3/tests/test_verifier.py
    src/ski_model/v3/tests/test_verifier_grounding.py
    src/ski_model/v3/tests/test_verifier_spec_predicates.py
    src/ski_model/v3/tests/test_verifier_stateful.py
    src/ski_model/v3/tests/test_risk_policy.py
    src/ski_model/v3/tests/test_risk_tier_governor.py
    src/ski_model/v3/tests/test_fail_closed_soundness.py
    src/ski_model/v3/tests/test_fail_closed_property.py
    src/ski_model/v3/tests/test_evaluator.py
    src/ski_model/v3/tests/test_taxonomy_guard.py
    src/ski_model/v3/tests/test_output_contract_guard.py
    src/ski_model/v3/tests/test_freshness_gate.py
    src/ski_model/v3/tests/test_adversarial_telemetry.py
also_copy =
    src
