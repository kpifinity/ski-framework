# SKI Evals — verdict-accuracy evaluation suite.
#
# One job here:
#   * evals-fake: gating harness check on every PR that touches evals/
#     or the v3 evaluator. FakeLLM baseline is pinned by
#     evals/tests/test_evals_harness.py, so any behaviour change in the
#     evaluator/verifier/scoping shows up here as a red diff.
#   Real-model runs (two model families, three seeds, every dataset, Wilson
#   95% intervals) are in evals-real.yml.
name: evals

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "evals/**"
      - "reference-implementation/src/ski_model/v3/**"
      - ".github/workflows/evals.yml"

permissions:
  contents: read

jobs:
  evals-fake:
    name: Evals harness (FakeLLM, pinned baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q evals/tests/
      - run: python -m evals.datasets.generate --check
      - run: python -m evals.run --backend fake --dataset all --seeds 0 1 2 --out evals-report
        env:
          # v3.2.0: the backend factory refuses FakeLLM without this opt-in.
          SKI_ALLOW_FAKE_LLM: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: evals-report-fake
          path: evals-report/
