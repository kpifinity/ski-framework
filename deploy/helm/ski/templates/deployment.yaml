{{- include "ski.validate" . -}}
{{- include "ski.validateTrust" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ski.fullname" . }}-model
  labels:
    {{- include "ski.labels" . | nindent 4 }}
    app.kubernetes.io/component: ski-model
spec:
  # ONE Pod per ledger. Recreate strategy: the old single writer must be
  # gone before the new one starts. Do not put this behind an HPA.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ski.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: ski-model
  template:
    metadata:
      labels:
        {{- include "ski.labels" . | nindent 8 }}
        app.kubernetes.io/component: ski-model
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ski-model
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: api
              containerPort: 8000
          env:
            - name: SKI_MODEL_WORKERS
              value: "1"
            - name: SKI_V3_LLM_BACKEND
              value: {{ .Values.skiModel.backend | quote }}
            {{- if and (eq .Values.skiModel.backend "fake") .Values.skiModel.allowFakeLlm }}
            - name: SKI_ALLOW_FAKE_LLM
              value: "true"
            {{- end }}
            - name: SKI_SOVEREIGNTY
              value: {{ .Values.skiModel.sovereignty.mode | quote }}
            {{- with .Values.skiModel.sovereignty.localDomains }}
            - name: SKI_SOVEREIGN_LOCAL_DOMAINS
              value: {{ . | quote }}
            {{- end }}
            - name: SKI_MODEL_NAME
              value: {{ .Values.skiModel.modelName | quote }}
            - name: SKI_MODEL_SEED
              value: {{ .Values.skiModel.seed | quote }}
            - name: SKI_MODEL_MAX_TOKENS
              value: {{ .Values.skiModel.maxTokens | quote }}
            {{- if .Values.skiModel.modelFileSha256 }}
            - name: SKI_MODEL_FILE_SHA256
              value: {{ .Values.skiModel.modelFileSha256 | quote }}
            {{- end }}
            {{- if eq .Values.skiModel.backend "ollama" }}
            - name: OLLAMA_BASE_URL
              value: {{ include "ski.ollamaUrl" . | quote }}
            {{- end }}
            {{- if eq .Values.skiModel.backend "vllm" }}
            - name: VLLM_BASE_URL
              value: {{ .Values.skiModel.externalVllmUrl | quote }}
            {{- end }}
            - name: KG_PATH
              value: /app/kg/kg.json
            - name: KG_REQUIRE_SIGNATURE
              value: {{ .Values.kg.requireSignature | quote }}
            {{- if .Values.kg.trustAnchors.configMapName }}
            - name: SKI_KG_TRUST_ANCHORS
              value: /app/trust/kg-trust-anchors.pem
            {{- end }}
            {{- if .Values.kg.allowUnanchored }}
            - name: SKI_KG_ALLOW_UNANCHORED
              value: "true"
            {{- end }}
            {{- if .Values.kg.hotLoad.enabled }}
            - name: SKI_ENABLE_KG_HOT_LOAD
              value: "true"
            - name: SKI_ADMIN_API_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret | quote }}, key: admin-api-key}
            {{- end }}
            - name: TLS_ENABLED
              value: {{ .Values.tls.enabled | quote }}
            - name: SKI_TENANT_ID
              value: {{ .Values.skiModel.tenantId | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.skiModel.logLevel | quote }}
            - name: SKI_AGREEMENT_WINDOW
              value: {{ .Values.skiModel.agreementWindow | quote }}
            - name: SKI_AGREEMENT_THRESHOLD
              value: {{ .Values.skiModel.agreementThreshold | quote }}
            {{- if .Values.skiModel.transcriptKey.existingSecret }}
            - name: SKI_TRANSCRIPT_KEY_PATH
              value: /app/keys/transcript.ed25519
            {{- else if .Values.skiModel.persistence.enabled }}
            - name: SKI_TRANSCRIPT_KEY_PATH
              value: /data/keys/transcript.ed25519
            {{- end }}
            - name: SKI_ALLOW_KEY_GENERATION
              value: {{ and .Values.skiModel.transcriptKey.allowGeneration (not .Values.skiModel.transcriptKey.existingSecret) | ternary "true" "false" | quote }}
            - name: API_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret | quote }}, key: api-key}
            {{- if and .Values.postgres.bundled .Values.postgres.useWriterRole }}
            # v3.2.0: the runtime connects as the least-privilege
            # ski_ledger_writer role (INSERT + SELECT), never the owner.
            - name: SKI_LEDGER_WRITER_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret | quote }}, key: ledger-writer-password}
            - name: LEDGER_DSN
              value: "postgresql://ski_ledger_writer:$(SKI_LEDGER_WRITER_PASSWORD)@{{ include "ski.fullname" . }}-postgres:5432/{{ .Values.postgres.database }}"
            {{- else }}
            - name: LEDGER_DSN
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret | quote }}, key: ledger-dsn}
            {{- end }}
          volumeMounts:
            - {name: kg, mountPath: /app/kg, readOnly: true}
            {{- if .Values.kg.trustAnchors.configMapName }}
            - {name: kg-trust-anchors, mountPath: /app/trust, readOnly: true}
            {{- end }}
            {{- if .Values.skiModel.transcriptKey.existingSecret }}
            - {name: transcript-key, mountPath: /app/keys, readOnly: true}
            {{- end }}
            {{- if .Values.tls.enabled }}
            - {name: tls, mountPath: /app/tls, readOnly: true}
            {{- end }}
            {{- if .Values.skiModel.persistence.enabled }}
            - {name: data, mountPath: /data}
            {{- end }}
          {{- $scheme := .Values.tls.enabled | ternary "HTTPS" "HTTP" }}
          startupProbe:
            httpGet: {path: /api/health, port: api, scheme: {{ $scheme }}}
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /api/health, port: api, scheme: {{ $scheme }}}
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /api/health, port: api, scheme: {{ $scheme }}}
            periodSeconds: 10
          resources: {{- toYaml .Values.skiModel.resources | nindent 12 }}
      volumes:
        - name: kg
          {{- if .Values.kg.fromSecret }}
          secret: {secretName: {{ .Values.kg.configMapName | quote }}}
          {{- else }}
          configMap: {name: {{ .Values.kg.configMapName | quote }}}
          {{- end }}
        {{- with .Values.kg.trustAnchors }}
        {{- if .configMapName }}
        - name: kg-trust-anchors
          {{- if .fromSecret }}
          secret:
            secretName: {{ .configMapName | quote }}
            items: [{key: kg-trust-anchors.pem, path: kg-trust-anchors.pem}]
          {{- else }}
          configMap:
            name: {{ .configMapName | quote }}
            items: [{key: kg-trust-anchors.pem, path: kg-trust-anchors.pem}]
          {{- end }}
        {{- end }}
        {{- end }}
        {{- if .Values.skiModel.transcriptKey.existingSecret }}
        - name: transcript-key
          secret:
            secretName: {{ .Values.skiModel.transcriptKey.existingSecret | quote }}
            defaultMode: 0440
            items: [{key: transcript.ed25519, path: transcript.ed25519}]
        {{- end }}
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName | quote }}
            items:
              - {key: tls.crt, path: ski-model.crt}
              - {key: tls.key, path: ski-model.key}
        {{- end }}
        {{- if .Values.skiModel.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "ski.fullname" . }}-model-data
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
